<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Temple</title>
<script src="data.js"></script>
<style>
body { font-family: Arial; margin:0; background:#eee; }

/* HEADER */
header {
  background: orange;
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
}

/* NAV */
nav {
  background:#ccc;
  text-align:center;
  padding:10px;
}
nav a {
  margin:10px;
  color:blue;
  font-weight:bold;
}

/* MAIN LAYOUT */
.main {
  display:flex;
}

/* LEFT PANEL */
.left {
  width:250px;
  padding:10px;
}

/* RIGHT PANEL */
.right {
  flex:1;
  padding:10px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(120px,1fr));
  gap:10px;
}

/* CARD */
.card {
  background:white;
  padding:5px;
  border-radius:10px;
  text-align:center;
}

.card img {
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:8px;
}

.category {
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-weight:bold;
  height:100px;
  border-radius:10px;
}

.fellow { background:orange; }
.master { background:skyblue; }
.architect { background:#1976d2; }
.tech { background:#ff7043; }

select { padding:5px; margin:5px; }

</style>
</head>

<body>
<header>
🙏 రాఘవరాజపురం హిందూ కుటుంబానికి స్వాగతం 🙏
</header>

<nav>
<a>Families</a>
<a>Year</a>
<a>Festivals</a>
<a>Photos</a>
<a>Videos</a>
<a>Donations</a>
<a>Bills</a>
</nav>

<div class="main">

<!-- LEFT SIDE -->
<div class="left">

<h2>Select Year & Festival</h2>

<select id="year">
  <option>2025</option>
  <option>2026</option>
  <option>2027</option>
  <option>2028</option>
</select>

<select id="festival">
  <option>Pongal</option>
  <option>Thirunal</option>
  <option>Jathara</option>
  <option>Vinayaka Chavithi</option>
  <option>Om Sakthi</option>
  <option>Ayyappa Swamy</option>
</select>

<br><br>

<button onclick="go()">View</button>

<script>
function go(){
  const year = document.getElementById("year").value;
  const fest = document.getElementById("festival").value;

  window.location.href = `festival.html?year=${year}&fest=${fest}`;
}
</script>

</body>
</html>
